services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tea-disease-app:latest
    container_name: tea_disease_web
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - ./work:/app/work
      - ./data:/app/data
    entrypoint: ["python", "-m", "uvicorn", "web.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
